name: GOIR daily sync

on:
  schedule:
    # 19:07 IST is 13:37 UTC. Deliberately an odd minute: GitHub delays
    # scheduled runs at busy times (its docs name the start of every hour)
    # and, under enough load, drops them. The first scheduled run, set for
    # 19:00 IST on 4 Oct 2026, never started (still nothing at 20:42). A
    # missed day costs a day's delay, not orders: the next run's 15-day window
    # covers it.
    - cron: "37 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reads the portal and parses, writing nothing; full loads"
        type: choice
        options: [dry-run, full]
        default: dry-run
      lookback:
        description: "Days to re-check by G.O. date (blank: 15, or 60 on Sundays)"
        required: false
        default: ""
      limit:
        description: "At most this many new orders (blank: no limit)"
        required: false
        default: ""

permissions:
  contents: read

# Never two runs at once: the second would race the first for the same orders.
concurrency:
  group: goir-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract (scans) and antiword (old Word files)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng antiword
          tesseract --version | head -1

      - run: pip install -r requirements.txt

      - name: Self-test (imports; Tesseract reads a scan; each secret works; the relay reaches the portal)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The portal answers only from India; this runner is in the US. Its
          # requests go through relay/ on Google Cloud Run in Mumbai.
          GOIR_RELAY_URL: https://goir-relay-968069382233.asia-south1.run.app
          GOIR_RELAY_TOKEN: ${{ secrets.GOIR_RELAY_TOKEN }}
        run: python selftest.py

      - name: Sync
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The portal answers only from India; this runner is in the US. Its
          # requests go through relay/ on Google Cloud Run in Mumbai.
          GOIR_RELAY_URL: https://goir-relay-968069382233.asia-south1.run.app
          GOIR_RELAY_TOKEN: ${{ secrets.GOIR_RELAY_TOKEN }}
          # Inputs go through the environment, never into the script text.
          # A scheduled run has no inputs, so it is a full run.
          MODE: ${{ inputs.mode || 'full' }}
          LOOKBACK: ${{ inputs.lookback }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -- --mode "$MODE"
          if [ -n "$LOOKBACK" ]; then set -- "$@" --lookback "$LOOKBACK"; fi
          if [ -n "$LIMIT" ]; then set -- "$@" --limit "$LIMIT"; fi
          python sync.py "$@"

      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-report
          path: out/sync_report.json
          retention-days: 30
          if-no-files-found: ignore
